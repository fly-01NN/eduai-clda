<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="7in" height="3.0333in" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Cross-Layer Dependency Audit study design</title>
  <desc id="desc">Discovery and screening feed four layer-specific dependency signals. Projects with both a service and model signal define the matched analysis.</desc>
  <defs>
    <marker id="arrow-black" markerWidth="6.8" markerHeight="6.8" refX="8.1" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,7 L8.5,3.5 z" fill="#111111"/>
    </marker>
    <marker id="arrow-blue" markerWidth="6.8" markerHeight="6.8" refX="8.1" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,7 L8.5,3.5 z" fill="#2A6F97"/>
    </marker>
    <marker id="arrow-orange" markerWidth="6.8" markerHeight="6.8" refX="8.1" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,7 L8.5,3.5 z" fill="#C76C2E"/>
    </marker>
    <style>
      .txt { font-family: Calibri, sans-serif; fill: #000000; }
      .stage-no { font-size: 24px; font-weight: 700; fill: #2A6F97; letter-spacing: 0.7px; }
      .stage { font-size: 31px; font-weight: 700; }
      .head { font-size: 28px; font-weight: 700; }
      .body { font-size: 28px; font-weight: 400; }
      .small { font-size: 28px; font-weight: 400; }
      .microhead { font-size: 28px; font-weight: 700; letter-spacing: 0.2px; }
      .count { font-size: 28px; font-weight: 700; }
      .box { fill: #ffffff; stroke: #202020; stroke-width: 1.7; rx: 4; }
      .flow { fill: none; stroke: #111111; stroke-width: 1.8; marker-end: url(#arrow-black); }
      .input-connector { fill: none; stroke: #111111; stroke-width: 1.5; }
      .primary-flow { fill: none; stroke: #2A6F97; stroke-width: 2.0; marker-end: url(#arrow-blue); }
      .primary-connector { fill: none; stroke: #2A6F97; stroke-width: 1.7; }
      .support-flow { fill: none; stroke: #C76C2E; stroke-width: 1.7; stroke-dasharray: 6 5; marker-end: url(#arrow-orange); }
      .support-connector { fill: none; stroke: #C76C2E; stroke-width: 1.6; stroke-dasharray: 6 5; }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="520" fill="#ffffff"/>
  <rect x="20" y="0" width="380" height="5" fill="#2A6F97"/>
  <rect x="450" y="0" width="350" height="5" fill="#2A6F97"/>
  <rect x="850" y="0" width="330" height="5" fill="#2A6F97"/>
  <line x1="20" y1="519" x2="400" y2="519" stroke="#C8CDD1" stroke-width="1.2"/>
  <line x1="450" y1="519" x2="800" y2="519" stroke="#C8CDD1" stroke-width="1.2"/>
  <line x1="850" y1="519" x2="1180" y2="519" stroke="#C8CDD1" stroke-width="1.2"/>

  <!-- Discovery occupies the upper half of the first column. -->
  <text class="txt stage-no" x="22" y="41">01</text>
  <text class="txt stage" x="68" y="42">Discovery</text>
  <text class="txt head" x="210" y="88" text-anchor="middle">15 functional queries</text>
  <path d="M210 101 V117 M210 117 H110 V132 M210 117 H310 V132" fill="none" stroke="#111111" stroke-width="1.7"/>
  <rect class="box" x="25" y="133" width="170" height="48"/>
  <rect class="box" x="225" y="133" width="170" height="48"/>
  <text class="txt small" x="110" y="165" text-anchor="middle">Likes rank</text>
  <text class="txt small" x="310" y="165" text-anchor="middle">Newest rank</text>
  <path d="M110 183 V195 L210 211 M310 183 V195 L210 211" fill="none" stroke="#111111" stroke-width="1.7"/>
  <path class="flow" d="M210 211 V224"/>
  <rect x="45" y="232" width="330" height="70" fill="#F2F7FA" stroke="#2A6F97" stroke-width="2" rx="4"/>
  <text class="txt body" x="210" y="261" text-anchor="middle">Ranked union</text>
  <text class="txt count" x="210" y="293" text-anchor="middle">n = 764</text>

  <line x1="20" y1="326" x2="199" y2="326" stroke="#C8CDD1" stroke-width="1.2"/>
  <line x1="221" y1="326" x2="400" y2="326" stroke="#C8CDD1" stroke-width="1.2"/>
  <path class="flow" d="M210 304 V337"/>

  <!-- Screening is stacked below discovery rather than extending the horizontal chain. -->
  <text class="txt stage-no" x="22" y="369">02</text>
  <text class="txt stage" x="68" y="370">Screening</text>
  <rect class="box" x="20" y="395" width="180" height="74"/>
  <rect x="220" y="395" width="180" height="74" fill="#F2F7FA" stroke="#2A6F97" stroke-width="2" rx="4"/>
  <text class="txt small" x="110" y="424" text-anchor="middle">Education rule</text>
  <text class="txt count" x="110" y="455" text-anchor="middle">n = 706</text>
  <path class="flow" d="M202 432 H216"/>
  <text class="txt small" x="310" y="424" text-anchor="middle">Observable</text>
  <text class="txt count" x="310" y="455" text-anchor="middle">n = 530</text>
  <text class="txt small" x="210" y="502" text-anchor="middle">fixed repository snapshot</text>

  <path class="flow" d="M402 432 H438 V276 H443"/>
  <path class="input-connector" d="M447 155 V449 M447 155 H450 M447 229 H450 M447 378 H450 M447 449 H450"/>

  <!-- Layer-resolved evidence receives the screened frame. -->
  <text class="txt stage-no" x="450" y="41">03</text>
  <text class="txt stage" x="496" y="42">Dependency evidence</text>

  <text class="txt microhead" x="450" y="92">Paired layers</text>
  <line x1="450" y1="103" x2="800" y2="103" stroke="#2A6F97" stroke-width="1.7"/>
  <rect x="450" y="124" width="7" height="62" fill="#2A6F97"/>
  <text class="txt head" x="468" y="164" font-style="italic">S</text>
  <text class="txt" x="484" y="172" font-size="18" font-style="italic">i</text>
  <text class="txt body" x="514" y="164">Identifiable services</text>
  <rect x="450" y="198" width="7" height="62" fill="#2A9D8F"/>
  <text class="txt head" x="466" y="238" font-style="italic">M</text>
  <text class="txt" x="486" y="246" font-size="18" font-style="italic">i</text>
  <text class="txt body" x="514" y="238">Referenced models</text>

  <text class="txt microhead" x="450" y="317">Additional signals</text>
  <line x1="450" y1="328" x2="800" y2="328" stroke="#C76C2E" stroke-width="1.7"/>
  <rect x="450" y="350" width="7" height="56" fill="#725A9A"/>
  <text class="txt head" x="468" y="387" font-style="italic">R</text>
  <text class="txt" x="484" y="395" font-size="18" font-style="italic">i</text>
  <text class="txt body" x="514" y="387" style="font-size:24px">User-managed runtimes</text>
  <rect x="450" y="421" width="7" height="56" fill="#C76C2E"/>
  <text class="txt head" x="468" y="458" font-style="italic">C</text>
  <text class="txt" x="485" y="466" font-size="18" font-style="italic">i</text>
  <text class="txt body" x="514" y="458">Unresolved candidates</text>

  <path class="primary-connector" d="M790 155 H800 V229 H790"/>
  <path class="primary-flow" d="M800 192 H846"/>
  <path class="support-connector" d="M790 378 H800 V449 H790"/>
  <path class="support-flow" d="M800 414 H816 V405 H1112.5 V417"/>

  <!-- Matched projects define the principal cross-layer estimand. -->
  <text class="txt stage-no" x="850" y="41">04</text>
  <text class="txt stage" x="896" y="42">Matched analysis</text>
  <rect x="850" y="86" width="330" height="166" fill="#ffffff" stroke="#2A6F97" stroke-width="2" rx="4"/>
  <text class="txt microhead" x="1015" y="119" text-anchor="middle">Matched projects</text>
  <text class="txt" x="890" y="170" font-size="27" font-style="italic">S</text>
  <text class="txt" x="908" y="178" font-size="18" font-style="italic">i</text>
  <text x="926" y="170" font-family="DejaVu Sans, sans-serif" font-size="27">≠ ∅</text>
  <text class="txt" x="993" y="170" font-size="27">and</text>
  <text class="txt" x="1049" y="170" font-size="27" font-style="italic">M</text>
  <text class="txt" x="1071" y="178" font-size="18" font-style="italic">i</text>
  <text x="1093" y="170" font-family="DejaVu Sans, sans-serif" font-size="27">≠ ∅</text>
  <text class="txt count" x="1015" y="219" text-anchor="middle">n = 99</text>

  <path class="primary-flow" d="M1015 254 V278"/>
  <rect x="850" y="290" width="330" height="94" fill="#F2F7FA" stroke="#2A6F97" stroke-width="2" rx="4"/>
  <text class="txt head" x="1015" y="329" text-anchor="middle">Paired ΔHHI</text>
  <text class="txt small" x="1015" y="361" text-anchor="middle">service HHI − model HHI</text>

  <path class="primary-flow" d="M850 220 H838 V448 H846"/>
  <rect class="box" x="850" y="421" width="190" height="55"/>
  <rect class="box" x="1045" y="421" width="135" height="55"/>
  <text class="txt small" x="945" y="456" text-anchor="middle">Co-declaration</text>
  <text class="txt small" x="1112.5" y="456" text-anchor="middle">Sensitivity</text>
</svg>
